[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-rag-cs-qa"
version = "0.1.0"
description = "Hybrid GraphRAG and RAPTOR experiments for computer science course QA"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "joblib>=1.3",
  "networkx>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
embeddings = ["sentence-transformers>=3.0"]

[project.scripts]
cs-rag = "hybrid_rag_cs_qa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
